name: ci

# GitHub's `schedule` trigger has no timeliness guarantee — a "*/5" cron was
# measured firing 3 times in 6.5 hours. So instead of one short run per poll,
# this is a single long-lived run that polls internally and is succeeded by
# another before hitting the 6h job limit.
#
# The successor is queued up front rather than dispatched on the way out. A
# dying run cannot be relied on to execute one last command — a killed runner
# or a hard job timeout would take the whole chain with it — but a run already
# sitting pending in the concurrency group starts on its own the moment this
# one stops, however it stops. The step at the end then re-queues, replacing
# that standby with one built from current main; if that step never runs, the
# standby is still there. watchdog.yml is the last resort if both are lost.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci
  cancel-in-progress: false

env:
  POLL_SECONDS: 75
  # 5h40m, leaving headroom under timeout-minutes for the closing step.
  LOOP_SECONDS: 20400

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the in-loop rebase onto origin/main works.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/sync/requirements.txt

      - run: pip install -r tools/sync/requirements.txt

      # Deliberately after setup rather than first: a run that dies during
      # checkout or pip dies in seconds, and queueing a successor from there
      # would spin the chain as fast as runners can start. Everything past
      # this point is the 5h40m poll, which is what needs the safety net.
      - name: Queue standby successor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Poll
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Push the state file if it moved. Never fatal: the workspace copy
          # survives to the next iteration, so a failed push just retries.
          sync_state() {
            if [ -n "$(git status --porcelain .cache/)" ]; then
              git add .cache/
              git commit -q -m "chore: update cache [skip ci]"
            fi
            git fetch -q origin main || return 0
            [ -z "$(git log origin/main..HEAD --oneline)" ] && return 0
            if git rebase -q origin/main && git push -q origin HEAD:main; then
              return 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "  state push failed; retrying next iteration"
          }

          deadline=$(( $(date +%s) + LOOP_SECONDS ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            echo "--- $(date -u +%H:%M:%S) UTC ---"
            python -m tools.sync.main || echo "  iteration failed, continuing"
            # Never let a git hiccup end the step early — that would cut the
            # poll window short and start the next link in the chain.
            sync_state || true
            sleep "$POLL_SECONDS"
          done

      # Replace the standby with a run built from current main, so a code fix
      # lands on the next link instead of the one after it. Superseding the
      # pending run is exactly what the concurrency group does for us.
      - name: Refresh successor
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main -R "$GITHUB_REPOSITORY"
